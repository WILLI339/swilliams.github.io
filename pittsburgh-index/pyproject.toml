[project]
name = "pittsburgh-index"
version = "0.1.0"
description = "Pittsburgh Stock Index — custom indexes tracking Pittsburgh-area public companies"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "yfinance>=0.2.30",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "seaborn>=0.13",
]

[project.optional-dependencies]
inflation = [
    "fredapi>=0.5",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
pittsburgh-index = "src.cli:main"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

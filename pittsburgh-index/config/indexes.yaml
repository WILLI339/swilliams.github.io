    - ticker: MSFT
      name: "Microsoft"
      sector: "Technology"
      added: "2015-01-02"
      removed: null
      notes: "Regional office in Pittsburgh"

    - ticker: RTX
      name: "RTX Corporation"
      sector: "Industrials"
      added: "2015-01-02"
      removed: null
      notes: "Manufacturing facilities in Pittsburgh area"

    - ticker: ETN

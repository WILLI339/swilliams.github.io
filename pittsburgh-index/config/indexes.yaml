      added: "2015-01-02"
      removed: null

    - ticker: ANSS
      name: "Ansys"
      sector: "Technology"
      added: "2015-01-02"
      removed: null
      notes: "Headquartered in Canonsburg, PA (Pittsburgh MSA)"

    - ticker: WAB
      name: "Wabtec Corporation"
      sector: "Industrials"
      added: "2015-01-02"

pgh_ops_index:
  name: "Pittsburgh Operations Index"
  description: >
    An index of the largest publicly traded companies with significant
    operational presence in the Pittsburgh MSA, regardless of where they are
    headquartered. This index is a superset of the HQ Index — all HQ Index
    constituents are automatically included.
  base_date: "2015-01-02"
  base_value: 100
  weighting: "market_cap"        # market_cap | equal
  rebalance_frequency: "quarterly"

  inclusion_criteria:
    exchange: ["NYSE", "NASDAQ"]
    geography: "Pittsburgh MSA"
    requirement: "significant_operations"
    min_market_cap_millions: 500
    min_avg_daily_volume: 100000
    min_employees_in_msa: 500
    notes: >
      A company qualifies for the Operations Index if it meets at least one of
      the following criteria:
        (a) Maintains its principal executive offices in the Pittsburgh MSA
            (i.e., qualifies for the HQ Index), OR
        (b) Operates a major office, R&D center, engineering hub, or regional
            headquarters in the Pittsburgh MSA with at least 500 employees, OR
        (c) Operates a major manufacturing plant, distribution center, or
            production facility in the Pittsburgh MSA with at least 500
            employees.
      Employee counts are based on publicly available information, press
      releases, and local reporting. Companies are reviewed at each quarterly
      rebalance.

  # All HQ Index constituents are included automatically.
  # The `include_hq_index` flag avoids duplicating the full HQ list here.
  include_hq_index: true

  # Additional constituents beyond the HQ Index:
  constituents:
    - ticker: GOOGL
      name: "Alphabet (Google)"
      sector: "Technology"
      added: "2015-01-02"
      removed: null

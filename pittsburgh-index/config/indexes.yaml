# Pittsburgh Stock Indexes - Constituent Definitions
#
# Two indexes are defined:
#   1. Pittsburgh HQ Index: Companies headquartered in the Pittsburgh MSA
#   2. Pittsburgh Operations Index: Companies with significant operations in the Pittsburgh MSA
#
# Inclusion criteria are documented per-index below.
# The `added` and `removed` fields handle historical constituent changes:
#   - `added`: Date the company entered the index (or the index base date)
#   - `removed`: Date the company left the index (null = still active)
#   - Companies are only included in calculations for the period [added, removed)

pgh_hq_index:
  name: "Pittsburgh HQ Index"
  description: >
    An index of the largest publicly traded companies headquartered in the
    Pittsburgh Metropolitan Statistical Area (MSA). The Pittsburgh MSA includes
    Allegheny, Westmoreland, Washington, Butler, Beaver, Fayette, and Armstrong
    counties in southwestern Pennsylvania.
  base_date: "2015-01-02"
  base_value: 100
  weighting: "market_cap"        # market_cap | equal
  rebalance_frequency: "quarterly"

  inclusion_criteria:
    exchange: ["NYSE", "NASDAQ"]
    geography: "Pittsburgh MSA"
    requirement: "headquarters"
    min_market_cap_millions: 500
    min_avg_daily_volume: 100000
    notes: >
      Company must maintain its principal executive offices (as reported in SEC
      filings) within the Pittsburgh MSA. If a company relocates its headquarters
      outside the MSA, it is removed at the next quarterly rebalance.

  constituents:
    - ticker: PNC
      name: "PNC Financial Services"
      sector: "Financials"
      added: "2015-01-02"
      removed: null


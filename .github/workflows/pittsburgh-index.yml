name: Pittsburgh Stock Index

on:
  workflow_dispatch:
    inputs:
      inflation:
        description: Include inflation-adjusted charts (requires FRED_API_KEY secret)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate-report:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pittsburgh-index

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pittsburgh-index/pyproject.toml

      - name: Install dependencies
        run: |
          pip install -e ".[inflation]"

      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: pittsburgh-index/data/raw
          key: pgh-index-data-${{ github.run_id }}
          restore-keys: pgh-index-data-

      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ "${{ inputs.inflation }}" = "true" ]; then
            python -m src.cli run --inflation -v
          else
            python -m src.cli run -v
          fi

      - name: Upload charts
        uses: actions/upload-artifact@v4
        with:
          name: pittsburgh-index-charts
          path: pittsburgh-index/output/charts/

      - name: Commit updated charts
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f pittsburgh-index/output/charts/*.png
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Pittsburgh Stock Index report $(date -u +%Y-%m-%d)"
            git push
          fi
